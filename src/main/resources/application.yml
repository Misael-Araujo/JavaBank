spring:
  application:
    name: javabank
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  integrations:
    authorization-url: ${AUTHORIZATION_URL:https://run.mocky.io/v3/5794d450-d2e2-4412-8131-73d0293ac1cc}
    notification-url: ${NOTIFICATION_URL:https://run.mocky.io/v3/54dc2cf1-3add-45b5-b5a9-6bf7e7f1f4a6}
    connect-timeout: ${INTEGRATION_CONNECT_TIMEOUT:2s}
    read-timeout: ${INTEGRATION_READ_TIMEOUT:3s}

logging:
  level:
    root: INFO
    com.misael.financialservice: INFO
  structured:
    format:
      console: logstash
